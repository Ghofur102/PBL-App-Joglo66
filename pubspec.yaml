name: pbl_app_joglo66
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^8.1.0
  intl: ^0.20.2
  go_router: ^17.2.0
  http: ^1.6.0
  flutter_dotenv: ^6.0.0
  shared_preferences: ^2.5.5
  image_picker: ^1.2.2
  url_launcher: ^6.2.6
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/logo.jpg

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.jpg"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/logo.jpg"
    background_color: "#3a5a8c"
    theme_color: "#3a5a8c"
  windows:
    generate: true
    image_path: "assets/images/logo.jpg"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/logo.jpg"

